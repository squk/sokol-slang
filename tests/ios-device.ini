# Compile/link the Metal fixtures for physical iOS devices. No runtime wrapper is provided.
[binaries]
cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
objcpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
strip = ['xcrun', '--sdk', 'iphoneos', 'strip']

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[built-in options]
cpp_args = ['-target', 'arm64-apple-ios13.0']
cpp_link_args = ['-target', 'arm64-apple-ios13.0']
objcpp_args = ['-target', 'arm64-apple-ios13.0']
objcpp_link_args = ['-target', 'arm64-apple-ios13.0']

[properties]
needs_exe_wrapper = true
