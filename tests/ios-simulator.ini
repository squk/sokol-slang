# Apple Silicon simulator binaries. Add ios-simulator-run.ini to run on a booted simulator.
[binaries]
cpp = ['xcrun', '--sdk', 'iphonesimulator', 'clang++']
objcpp = ['xcrun', '--sdk', 'iphonesimulator', 'clang++']
ar = ['xcrun', '--sdk', 'iphonesimulator', 'ar']
strip = ['xcrun', '--sdk', 'iphonesimulator', 'strip']

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[built-in options]
cpp_args = ['-target', 'arm64-apple-ios14.0-simulator']
cpp_link_args = ['-target', 'arm64-apple-ios14.0-simulator']
objcpp_args = ['-target', 'arm64-apple-ios14.0-simulator']
objcpp_link_args = ['-target', 'arm64-apple-ios14.0-simulator']

[properties]
needs_exe_wrapper = true
