# Cross-compile native D3D11 fixtures on a host with MinGW-w64. Copy the .exe
# files to Windows to run them, or configure an exe_wrapper separately.
[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
cpp_link_args = ['-static']

[properties]
needs_exe_wrapper = true
